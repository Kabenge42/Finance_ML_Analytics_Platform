# Pre-commit hooks configuration for Finance ML Analytics Platform
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Environment validation - runs first to catch setup issues
  - repo: local
    hooks:
      - id: validate-environment
        name: Validate Python Environment
        entry: python validate_environment.py
        language: system
        pass_filenames: false
        stages: [ commit ]
        verbose: true

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        args: [ '--line-length=100' ]

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [ '--profile=black', '--line-length=100' ]

  # Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [ '--max-line-length=127', '--extend-ignore=E203,W503' ]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [ '--ignore-missing-imports', '--python-version=3.12' ]
        additional_dependencies: [ ]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [ '-c', 'pyproject.toml' ]
        additional_dependencies: [ 'bandit[toml]' ]

  # Check for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Jupyter notebook cleaning
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        args: [ '--extra-keys=metadata.kernel_spec metadata.language_info' ]

  # Documentation checks
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [ '--verbose', '--fail-under=50', '--ignore-init-method', '--ignore-init-module' ]
        pass_filenames: false

# CI integration - these settings optimize performance
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [ validate-environment ]  # Skip environment validation in CI
  submodules: false
