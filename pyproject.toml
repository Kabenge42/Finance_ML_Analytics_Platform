[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project Metadata
# ============================================================================
[project]
name = "finance-ml"
version = "0.9.1"
description = "A lightweight, notebook-centric workflow for equity screening, feature engineering, and machine learning models across global regions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Finance ML Team" }]

keywords = [
    "finance",
    "machine-learning",
    "analytics",
    "equity-screening",
    "feature-engineering",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]

# ============================================================================
# Core Dependencies
# ============================================================================
dependencies = [
    # Numerical computing and data structures
    # NumPy: require 2.x on Python 3.14+ to ensure prebuilt wheels are available
    "numpy>=1.26.0,<2.0.0; python_version < '3.14'",
    "numpy>=2.0.0,<3.0.0; python_version >= '3.14'",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    # Machine learning - core frameworks
    "scikit-learn>=1.4.0,<2.0.0",
    "imbalanced-learn>=0.11.0,<1.0.0",
    # Machine learning - gradient boosting
    "xgboost>=2.0.3,<3.0.0",
    "lightgbm>=4.0.0,<5.0.0",
    # CatBoost: gate on Python 3.14 due to missing cp314 wheels (2025-11). Install on 3.13
    # if needed, or wait for official 3.14 wheels.
    "catboost>=1.2.0,<2.0.0; python_version < '3.14'",
    # Model interpretability and explainability
    # SHAP 0.50.0 provides enhanced explainability features with improved performance.
    # SHAP depends on numba, which (as of 2025-11) does not support Python 3.14 yet.
    # Gate SHAP on <3.14 to avoid installation failure on 3.14.
    "shap==0.50.0; python_version < '3.14'",
    # Data visualization
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "plotly>=5.14.0,<6.0.0",
    # Utilities and performance
    "tqdm>=4.65.0,<5.0.0",
    "joblib>=1.3.0,<2.0.0",
    "xlsxwriter>=3.1.0,<4.0.0",
    "psutil>=5.9.0,<6.0.0",
]

# ============================================================================
# Optional Dependencies
# ============================================================================
[project.optional-dependencies]
# Development tools for testing, linting, and formatting
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<25.0.0",
    "flake8>=6.0.0,<8.0.0",
    "mypy>=1.5.0,<2.0.0",
    "isort>=5.12.0,<6.0.0",
]

# Deep learning support with TensorFlow/Keras
tensorflow = [
    # Note: Official TensorFlow wheels for Python 3.14 on Windows may lag behind.
    # Gate TF/Keras extras on <3.14 to avoid source builds and installation failures.
    "tensorflow>=2.13.0,<3.0.0; python_version < '3.14'",
    "scikeras>=0.12.0,<1.0.0; python_version < '3.14'",
]

# Database connectivity for PostgreSQL and SQL operations
database = [
    "psycopg2-binary>=2.9.0,<3.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
]

# Advanced feature selection and optimization
advanced-features = [
    "boruta>=0.3.0,<1.0.0",

]

# Jupyter notebook support
notebook = [
    "jupyter>=1.0.0,<2.0.0",
    "notebook>=7.0.0,<8.0.0",
    "ipykernel>=6.25.0,<7.0.0",
]

# Complete installation with all optional features
all = [
    "finance-ml[dev,tensorflow,database,advanced-features,notebook]",
]

# ============================================================================
# Command Line Interface
# ============================================================================
[project.scripts]
finance-ml = "finance_ml.cli:main"
finance-ml-analyze = "finance_ml.cli:analyze_main"
finance-ml-validate = "finance_ml.cli:validate_main"

# ============================================================================
# Project URLs
# ============================================================================
[project.urls]
Homepage = "https://github.com/Kabenge42/Finance_ML_Analytics_Platform"
Documentation = "https://github.com/Kabenge42/Finance_ML_Analytics_Platform/blob/main/README.md"
Repository = "https://github.com/Kabenge42/Finance_ML_Analytics_Platform"
Issues = "https://github.com/Kabenge42/Finance_ML_Analytics_Platform/issues"

# ============================================================================
# Package Configuration
# ============================================================================
[tool.setuptools]
packages = ["finance_ml"]

[tool.setuptools.package-data]
finance_ml = ["py.typed"]

# ============================================================================
# Code Quality Tools Configuration
# ============================================================================

# Black - Code Formatter
[tool.black]
line-length = 100
target-version = ["py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.venv
    | build
    | dist
)/
'''

# isort - Import Sorting
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Mypy - Static Type Checking
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# ============================================================================
# Testing and Coverage Configuration
# ============================================================================

# Pytest - Testing Framework
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage - Code Coverage Analysis
[tool.coverage.run]
source = ["finance_ml"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
