[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ml"
version = "0.3.0"
description = "A lightweight, notebook-centric workflow for equity screening, feature engineering, and machine learning models across global regions"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Finance ML Team"}
]
keywords = ["finance", "machine-learning", "analytics", "equity-screening", "feature-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "imbalanced-learn>=0.11.0,<1.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0,<5.0.0",
    "catboost>=1.2.0,<2.0.0",
    "shap>=0.42.0,<1.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "plotly>=5.14.0,<6.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "joblib>=1.3.0,<2.0.0",
    "xlsxwriter>=3.1.0,<4.0.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
tensorflow = [
    "tensorflow>=2.13.0,<3.0.0",
    "scikeras>=0.12.0,<1.0.0",
]
database = [
    "psycopg2-binary>=2.9.0",
    "SQLAlchemy>=2.0.0",
]
advanced-features = [
    "boruta>=0.3.0",
    "numba>=0.57.0,<1.0.0",
]
all = [
    "finance-ml[dev,tensorflow,database,advanced-features]",
]

[project.scripts]
finance-ml = "finance_ml.cli:main"
finance-ml-analyze = "finance_ml.cli:analyze_main"
finance-ml-validate = "finance_ml.cli:validate_main"

[project.urls]
Homepage = "https://github.com/yourusername/Finance_ML_Analytics_Platform"
Documentation = "https://github.com/yourusername/Finance_ML_Analytics_Platform/blob/main/README.md"
Repository = "https://github.com/yourusername/Finance_ML_Analytics_Platform"
Issues = "https://github.com/yourusername/Finance_ML_Analytics_Platform/issues"

[tool.setuptools]
packages = ["finance_ml"]

[tool.setuptools.package-data]
finance_ml = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["finance_ml"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
