name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Lint with flake8 (optional)
      continue-on-error: true
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 finance_ml --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 finance_ml --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run tests with pytest (with coverage)
      run: |
        pytest tests/ -v --cov=finance_ml --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-optional-deps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies with optional packages
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-cov
        # Install optional dependencies
        pip install psycopg2-binary sqlalchemy pyyaml

    - name: Run tests with optional dependencies
      run: |
        python -m unittest discover -s tests -v

  install-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test package installation
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Install in editable mode
        pip install -e .
        # Test imports
        python -c "import finance_ml; print(f'finance_ml version: {finance_ml.__version__}')"
        python -c "from finance_ml import load_config, get_config; print('Config imports OK')"
        python -c "from finance_ml.cli import main; print('CLI imports OK')"

    - name: Test CLI entry points
      run: |
        pip install -e .
        # Test that console scripts are installed
        finance-ml --help
        finance-ml-analyze --help
        finance-ml-validate --help

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy

    - name: Check code formatting with black
      continue-on-error: true
      run: |
        black --check finance_ml tests

    - name: Check import sorting with isort
      continue-on-error: true
      run: |
        isort --check-only finance_ml tests

    - name: Type check with mypy
      continue-on-error: true
      run: |
        mypy finance_ml --ignore-missing-imports
